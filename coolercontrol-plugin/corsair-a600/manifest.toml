id = "corsair-a600"
type = "device"
description = "Corsair ONE a600: feeds CPU/GPU temperatures to the cooling controller, monitors fans and pumps"
version = "0.3.1"
url = "https://github.com/martinschuberteu/coolercontrol-plugin-corsair-one-a600"
executable = "/usr/bin/python3"
args = ["-I", "/var/lib/coolercontrol/plugins/corsair-a600/corsair_a600_plugin.py"]
address = "/tmp/corsair-a600.sock"
privileged = false
