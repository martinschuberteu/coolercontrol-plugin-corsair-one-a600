<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Corsair ONE a600</title>
  <script src="/plugins/lib/cc-plugin-lib.js"></script>
  <style>
    /* CoolerControl sends its theme as "R G B" triplets in these variables (loadParentStyles).
       The values below are only a dark fallback until they arrive. */
    :root {
      --colors-bg-one: 32 33 36;
      --colors-bg-two: 40 42 46;
      --colors-border-one: 62 64 70;
      --colors-text-color: 225 227 230;
      --colors-text-color-secondary: 150 154 160;
      --colors-accent: 86 140 230;
      color-scheme: dark;
    }
    html, body { background: rgb(var(--colors-bg-one)); color: rgb(var(--colors-text-color)); }
    body { font-family: inherit; padding: 1.5rem; max-width: 40rem; margin: 0; }
    h1 { font-size: 1.3rem; margin: 0 0 0.25rem; }
    p.hint { color: rgb(var(--colors-text-color-secondary)); margin: 0 0 1.5rem; line-height: 1.5; }
    fieldset { background: rgb(var(--colors-bg-two)); border: 1px solid rgb(var(--colors-border-one)); border-radius: 8px; padding: 1rem 1.25rem; margin: 0 0 1.25rem; }
    legend { font-weight: 600; padding: 0 0.4rem; }
    label { display: flex; align-items: flex-start; gap: 0.6rem; margin: 0.5rem 0; cursor: pointer; }
    label small { display: block; color: rgb(var(--colors-text-color-secondary)); }
    input[type=radio] { accent-color: rgb(var(--colors-accent)); }
    button { padding: 0.5rem 1.2rem; border-radius: 6px; cursor: pointer; font: inherit;
             background: rgb(var(--colors-accent)); color: rgb(var(--colors-bg-one)); border: 1px solid rgb(var(--colors-accent)); }
    button:hover { filter: brightness(1.1); }
    button:focus-visible, input:focus-visible { outline: 2px solid rgb(var(--colors-accent)); outline-offset: 2px; }
    #saved { margin-left: 0.8rem; color: rgb(var(--colors-text-color-secondary)); }
  </style>
</head>
<body>
  <h1>Corsair ONE a600</h1>
  <p class="hint">The cooling controller runs Corsair's own fan curves on the CPU and GPU temperatures this plugin sends it every second. Fan and pump speeds appear under the a600 Cooling device.</p>

  <form id="settings">
    <fieldset>
      <legend>Fan mode</legend>
      <label><input type="radio" name="mode" value="balanced"><span>Balanced<small>Corsair's default. About 1000–1350 rpm at idle.</small></span></label>
      <label><input type="radio" name="mode" value="quiet"><span>Quiet<small>About 700–1100 rpm at idle; rises later under load.</small></span></label>
    </fieldset>
    <button type="submit">Save</button><span id="saved" aria-live="polite"></span>
  </form>

  <script>
    const form = document.getElementById('settings')
    const saved = document.getElementById('saved')

    // Native controls (radio buttons, scrollbars) follow color-scheme, so match it to the
    // theme's background once CoolerControl has sent its colours.
    const matchColorScheme = () => {
      const rgb = getComputedStyle(document.documentElement).getPropertyValue('--colors-bg-one').trim().split(/\s+/).map(Number)
      if (rgb.length !== 3 || rgb.some(Number.isNaN)) return
      const luminance = (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) / 255
      document.documentElement.style.colorScheme = luminance < 0.5 ? 'dark' : 'light'
    }

    ;(async () => {
      loadParentStyles()
      await waitTillAllMessagesReceived()
      matchColorScheme()
      const config = Object.assign({ mode: 'balanced' }, await getPluginConfig())
      form.querySelector(`input[name=mode][value=${config.mode === 'quiet' ? 'quiet' : 'balanced'}]`).checked = true
    })()

    successfulConfigSaveCallback(() => {
      saved.textContent = 'Saved. Applied within a second.'
      setTimeout(() => { saved.textContent = '' }, 4000)
    })

    form.addEventListener('submit', async (event) => {
      event.preventDefault()
      const mode = form.querySelector('input[name=mode]:checked').value
      await savePluginConfig({ mode })
    })
  </script>
</body>
</html>
